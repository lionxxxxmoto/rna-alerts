name: Journal Keyword Alert

on:
  schedule:
    # Runs every hour, at minute 0 (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run keyword check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_journals.py

      - name: Save seen-articles cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_articles.json
          git diff --staged --quiet || git commit -m "Update seen articles"
          git push
