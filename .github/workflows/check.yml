name: Journal Keyword Alert

on:
  schedule:
    # Runs once a day at 10:00 UTC = 6:00 AM Eastern Daylight Time
    # (current, through early November). GitHub Actions cron always
    # uses UTC, not local time. Once clocks fall back to Eastern
    # Standard Time in November, 6am ET becomes 11:00 UTC instead --
    # change "0 10" to "0 11" below at that point to keep it at 6am
    # local.
    - cron: "0 10 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # required so the "Save seen-articles cache" step can push back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run keyword check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_journals.py

      - name: Save seen-articles cache and match log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_articles.json matches_log.json
          git diff --staged --quiet || git commit -m "Update seen articles and match log"
          git push
