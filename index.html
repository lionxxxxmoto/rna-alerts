<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RNA Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RNA Tracker">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --paper: #FAF9F5;
    --ink: #1A1A18;
    --ink-soft: #6B6A63;
    --rule: #DEDCD2;
    --accent: #0F6E56;
    --accent-tint: #E1F0EA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header {
    padding: 28px 20px 16px;
    border-bottom: 1px solid var(--rule);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
  }

  /* Family tabs -- segmented control */
  .tabs {
    display: flex;
    gap: 4px;
    margin: 16px 20px 0;
    background: var(--accent-tint);
    border-radius: 10px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 4px;
    border-radius: 7px;
    color: var(--accent);
    background: transparent;
    border: none;
  }
  .tab.active {
    background: var(--accent);
    color: var(--paper);
  }

  /* Sub-journal pills */
  .subfilters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .subfilters:empty { padding: 0; }
  .subfilters::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto;
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .pill.active {
    background: var(--accent-tint);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* Date filter */
  .datefilter {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 20px 14px;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .datefilter input[type="date"] {
    font-size: 13px;
    border: 1px solid var(--rule);
    border-radius: 7px;
    padding: 6px 8px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
  }
  .datefilter .clear {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    background: none;
    border: none;
    padding: 4px 2px;
    margin-left: auto;
  }
  .datefilter .clear[hidden] { display: none; }

  main { padding: 4px 20px 60px; }

  .day-group { margin-top: 22px; }
  .day-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  a.entry {
    display: block;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
  }
  a.entry:active { opacity: 0.6; }
  .entry-journal {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .entry-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.35;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
  }
  .empty-title {
    font-family: Georgia, serif;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-body { font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>RNA Tracker</h1>
  <p class="subtitle" id="subtitle">Loading...</p>
</header>

<div class="tabs" id="tabs"></div>
<div class="subfilters" id="subfilters"></div>

<div class="datefilter">
  <label>From <input type="date" id="dateFrom"></label>
  <label>To <input type="date" id="dateTo"></label>
  <button class="clear" id="clearDates" hidden>Clear</button>
</div>

<main id="main">
  <div class="empty"><div class="empty-title">Loading articles...</div></div>
</main>

<script>
const DATA_URL = "matches_log.json";
let allMatches = [];
let activeFamily = "All";
let activeJournal = "All";
let dateFrom = "";
let dateTo = "";

// Journal family membership -- must match the journal names used in
// check_journals.py's FEEDS dict.
const FAMILIES = {
  Nature: [
    "Nature", "Nature Genetics", "Nature Medicine", "Nature Immunology",
    "Nature Methods", "Nature Biotechnology", "Nature Cell Biology",
    "Nature Neuroscience", "Nature Structural & Molecular Biology",
    "Nature Chemical Biology", "Nature Chemistry", "Nature Communications",
    "Nature Reviews Genetics", "Nature Reviews Molecular Cell Biology",
  ],
  Science: [
    "Science", "Science Advances", "Science Immunology",
    "Science Signaling", "Science Translational Medicine",
  ],
  Cell: [
    "Cell", "Molecular Cell", "Cell Reports", "Cell Metabolism",
    "Cell Stem Cell", "Cancer Cell", "Immunity", "Neuron",
    "Developmental Cell", "Cell Systems", "Structure",
    "Cell Chemical Biology", "Molecular Therapy Nucleic Acids",
  ],
};

function familyOf(journal) {
  for (const [fam, list] of Object.entries(FAMILIES)) {
    if (list.includes(journal)) return fam;
  }
  return "Other";
}

function formatDayLabel(dateStr) {
  const d = new Date(dateStr);
  const today = new Date();
  const yest = new Date(today); yest.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return "Today";
  if (sameDay(d, yest)) return "Yesterday";
  return d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function getFiltered() {
  return allMatches.filter(m => {
    if (activeFamily !== "All" && familyOf(m.journal) !== activeFamily) return false;
    if (activeJournal !== "All" && m.journal !== activeJournal) return false;
    if (dateFrom && m.date.slice(0, 10) < dateFrom) return false;
    if (dateTo && m.date.slice(0, 10) > dateTo) return false;
    return true;
  });
}

function renderTabs() {
  const tabs = ["All", "Science", "Nature", "Cell"];
  const el = document.getElementById("tabs");
  el.innerHTML = tabs.map(t =>
    `<button class="tab${t === activeFamily ? " active" : ""}" data-family="${t}">${t}</button>`
  ).join("");
  el.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      activeFamily = btn.dataset.family;
      activeJournal = "All";
      renderTabs();
      renderSubfilters();
      render();
    });
  });
}

function renderSubfilters() {
  const el = document.getElementById("subfilters");
  if (activeFamily === "All") {
    el.innerHTML = "";
    return;
  }
  const present = new Set(
    allMatches.filter(m => familyOf(m.journal) === activeFamily).map(m => m.journal)
  );
  const journals = ["All", ...FAMILIES[activeFamily].filter(j => present.has(j))];
  el.innerHTML = journals.map(j =>
    `<button class="pill${j === activeJournal ? " active" : ""}" data-journal="${escapeHtml(j)}">${escapeHtml(j === "All" ? "All " + activeFamily : j)}</button>`
  ).join("");
  el.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      activeJournal = btn.dataset.journal;
      renderSubfilters();
      render();
    });
  });
}

function render() {
  const main = document.getElementById("main");
  const filtered = getFiltered();

  document.getElementById("subtitle").textContent =
    filtered.length + (filtered.length === 1 ? " article" : " articles");

  if (filtered.length === 0) {
    main.innerHTML = '<div class="empty"><div class="empty-title">No articles</div>' +
      '<div class="empty-body">Nothing matches this filter yet.</div></div>';
    return;
  }

  const groups = {};
  const order = [];
  filtered.forEach(m => {
    const label = formatDayLabel(m.date);
    if (!groups[label]) { groups[label] = []; order.push(label); }
    groups[label].push(m);
  });

  main.innerHTML = order.map(label => {
    const items = groups[label].map(m => `
      <a class="entry" href="${m.link}" target="_blank" rel="noopener">
        <div class="entry-journal">${escapeHtml(m.journal)}</div>
        <div class="entry-title">${escapeHtml(m.title)}</div>
      </a>
    `).join("");
    return `<div class="day-group"><div class="day-label">${label}</div>${items}</div>`;
  }).join("");
}

document.getElementById("dateFrom").addEventListener("change", (e) => {
  dateFrom = e.target.value;
  document.getElementById("clearDates").hidden = !(dateFrom || dateTo);
  render();
});
document.getElementById("dateTo").addEventListener("change", (e) => {
  dateTo = e.target.value;
  document.getElementById("clearDates").hidden = !(dateFrom || dateTo);
  render();
});
document.getElementById("clearDates").addEventListener("click", () => {
  dateFrom = ""; dateTo = "";
  document.getElementById("dateFrom").value = "";
  document.getElementById("dateTo").value = "";
  document.getElementById("clearDates").hidden = true;
  render();
});

fetch(DATA_URL, { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    allMatches = data;
    renderTabs();
    renderSubfilters();
    render();
  })
  .catch(() => {
    document.getElementById("main").innerHTML =
      '<div class="empty"><div class="empty-title">Could not load articles</div>' +
      '<div class="empty-body">Check that matches_log.json is published alongside this page.</div></div>';
    document.getElementById("subtitle").textContent = "Error loading data";
  });
</script>

</body>
</html>
