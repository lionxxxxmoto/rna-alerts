<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RNA Watch</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RNA Watch">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --paper: #FAF9F5;
    --ink: #1A1A18;
    --ink-soft: #6B6A63;
    --rule: #DEDCD2;
    --accent: #0F6E56;
    --accent-tint: #E1F0EA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header {
    padding: 28px 20px 16px;
    border-bottom: 1px solid var(--rule);
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
  }

  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 20px;
    border-bottom: 1px solid var(--rule);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto;
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .pill.active {
    background: var(--accent-tint);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  main { padding: 4px 20px 60px; }

  .day-group { margin-top: 22px; }
  .day-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  a.entry {
    display: block;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
  }
  a.entry:active { opacity: 0.6; }
  .entry-journal {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .entry-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.35;
  }

  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
  }
  .empty-title {
    font-family: Georgia, serif;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .empty-body { font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>RNA Watch</h1>
  <p class="subtitle" id="subtitle">Loading...</p>
</header>

<div class="filters" id="filters"></div>

<main id="main">
  <div class="empty"><div class="empty-title">Loading articles...</div></div>
</main>

<script>
const DATA_URL = "matches_log.json";
let allMatches = [];
let activeFilter = "All";

function formatDayLabel(dateStr) {
  const d = new Date(dateStr);
  const today = new Date();
  const yest = new Date(today); yest.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return "Today";
  if (sameDay(d, yest)) return "Yesterday";
  return d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
}

function render() {
  const main = document.getElementById("main");
  const filtered = activeFilter === "All"
    ? allMatches
    : allMatches.filter(m => m.journal === activeFilter);

  document.getElementById("subtitle").textContent =
    filtered.length + (filtered.length === 1 ? " article" : " articles")
    + (activeFilter === "All" ? "" : " in " + activeFilter);

  if (filtered.length === 0) {
    main.innerHTML = '<div class="empty"><div class="empty-title">No articles yet</div>' +
      '<div class="empty-body">Matches will appear here after the next check.</div></div>';
    return;
  }

  const groups = {};
  const order = [];
  filtered.forEach(m => {
    const label = formatDayLabel(m.date);
    if (!groups[label]) { groups[label] = []; order.push(label); }
    groups[label].push(m);
  });

  main.innerHTML = order.map(label => {
    const items = groups[label].map(m => `
      <a class="entry" href="${m.link}" target="_blank" rel="noopener">
        <div class="entry-journal">${escapeHtml(m.journal)}</div>
        <div class="entry-title">${escapeHtml(m.title)}</div>
      </a>
    `).join("");
    return `<div class="day-group"><div class="day-label">${label}</div>${items}</div>`;
  }).join("");
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s || "";
  return d.innerHTML;
}

function renderFilters() {
  const journals = ["All", ...new Set(allMatches.map(m => m.journal))];
  const el = document.getElementById("filters");
  el.innerHTML = journals.map(j =>
    `<button class="pill${j === activeFilter ? " active" : ""}" data-journal="${escapeHtml(j)}">${escapeHtml(j)}</button>`
  ).join("");
  el.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.journal;
      renderFilters();
      render();
    });
  });
}

fetch(DATA_URL, { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    allMatches = data;
    renderFilters();
    render();
  })
  .catch(() => {
    document.getElementById("main").innerHTML =
      '<div class="empty"><div class="empty-title">Could not load articles</div>' +
      '<div class="empty-body">Check that matches_log.json is published alongside this page.</div></div>';
    document.getElementById("subtitle").textContent = "Error loading data";
  });
</script>

</body>
</html>
